#version: "3.8"

services:
  vizai_frontend:
    build: .
    container_name: vizai-frontend
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    ulimits:
      nofile:
        soft: 65536
        hard: 65536
